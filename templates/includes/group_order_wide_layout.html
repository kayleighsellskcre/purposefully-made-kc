{# Desktop layout for the group order create and edit forms. Included after
   each page's own styles so these rules win on wide screens. #}
<style>
.organizer-pair > .organizer-block:first-child { margin-top: 1.5rem; padding-top: 1.5rem; border-top: 1px solid var(--border-color); }
.collection-form .form-check { flex-wrap: wrap; margin-bottom: 0.75rem; }
.collection-form .form-check > .form-hint { flex-basis: 100%; }
.collection-form .visibility-toggle { border: 0; padding: 0; margin: 0.25rem 0 1rem; min-width: 0; }
.collection-form .visibility-toggle legend { padding: 0; margin-bottom: 0.5rem; font-weight: 500; color: var(--text-primary); }
.collection-form .visibility-toggle .form-check { margin-bottom: 0.4rem; }

@media (min-width: 900px) {
    .collection-form { max-width: none; }
    .collection-form .form-section { padding: 1.75rem 2rem; margin-bottom: 1.5rem; }
    .collection-form .form-section h2 { margin-bottom: 1.1rem; }
    .form-split { display: grid; grid-template-columns: minmax(0, 1fr) minmax(0, 1fr); gap: 0 2.5rem; align-items: start; }
    .group-template-grid,
    .group-kind-choices { grid-template-columns: repeat(3, minmax(0, 1fr)); }
    .collection-form .product-checkboxes { grid-template-columns: repeat(auto-fill, minmax(165px, 1fr)); gap: 0.85rem; }
    .fan-color-cards { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); align-items: start; }
    .organizer-pair {
        display: grid; grid-template-columns: minmax(0, 1fr) minmax(0, 1fr); gap: 2.5rem;
        margin-top: 1.5rem; padding-top: 1.5rem; border-top: 1px solid var(--border-color);
    }
    .organizer-pair > .organizer-block,
    .organizer-pair > .organizer-block:first-child { margin: 0; padding: 0; border: 0; }
    .collection-form .placement-checkboxes { grid-template-columns: repeat(auto-fit, minmax(170px, 1fr)); }
    .collection-form .organizer-pair .placement-checkboxes { grid-template-columns: 1fr 1fr; }
    .collection-form .font-choice-grid { grid-template-columns: repeat(5, minmax(0, 1fr)) !important; }
    .back-style-row { display: grid; grid-template-columns: minmax(0, 1fr) minmax(0, 1fr); gap: 2.5rem; align-items: center; }
    .back-style-row .coll-back-preview { margin-top: 1rem; min-height: 170px; }
    .wizard-review-list { display: grid; grid-template-columns: minmax(0, 1fr) minmax(0, 1fr); column-gap: 2.5rem; }
    .wizard-review-row:nth-child(2) { border-top: 0; }
}
</style>
