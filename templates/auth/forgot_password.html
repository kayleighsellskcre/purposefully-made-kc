{% extends "base.html" %}
{% block title %}Forgot Password - Purposefully Made KC{% endblock %}

{% block extra_css %}
<style>
.auth-page {
    min-height: 70vh;
    display: flex;
    align-items: center;
    justify-content: center;
    padding: 4rem 1rem;
}
.auth-card {
    background: #fff;
    border-radius: var(--border-radius);
    box-shadow: var(--box-shadow-luxury);
    border: 1px solid var(--border-light);
    padding: 2.5rem 2rem;
    width: 100%;
    max-width: 440px;
}
.auth-eyebrow {
    font-size: 0.75rem;
    font-weight: 700;
    letter-spacing: 0.14em;
    text-transform: uppercase;
    color: var(--accent-color);
    display: block;
    margin-bottom: 0.5rem;
    text-align: center;
}
.auth-card h1 {
    font-family: var(--font-heading);
    font-size: 1.75rem;
    text-align: center;
    margin-bottom: 0.5rem;
    color: var(--primary-color);
}
.auth-subtitle {
    text-align: center;
    color: var(--text-secondary);
    font-size: 0.9rem;
    margin-bottom: 2rem;
    line-height: 1.6;
}
.auth-field {
    margin-bottom: 1.25rem;
}
.auth-field label {
    display: block;
    font-size: 0.85rem;
    font-weight: 600;
    margin-bottom: 0.4rem;
    color: var(--text-primary);
}
.auth-field input {
    width: 100%;
    padding: 0.75rem 1rem;
    border: 1px solid var(--border-color);
    border-radius: 8px;
    font-size: 1rem;
    font-family: var(--font-body);
    transition: border-color 0.2s;
    box-sizing: border-box;
}
.auth-field input:focus {
    outline: none;
    border-color: var(--accent-color);
    box-shadow: 0 0 0 3px rgba(184, 124, 111, 0.12);
}
/* A 0.12-alpha ring is hard to find when tabbing. Keyboard focus gets a
   stronger one; clicking with a mouse keeps the subtle look above. */
.auth-field input:focus-visible {
    box-shadow: 0 0 0 3px rgba(184, 124, 111, 0.5);
}
.auth-submit {
    width: 100%;
    padding: 0.9rem;
    font-size: 0.9rem;
    font-weight: 700;
    letter-spacing: 0.06em;
    text-transform: uppercase;
    margin-top: 0.25rem;
}
.auth-links {
    text-align: center;
    margin-top: 1.5rem;
    font-size: 0.875rem;
    color: var(--text-secondary);
}
.auth-links a {
    color: var(--accent-color);
    text-decoration: none;
    font-weight: 600;
}
.auth-links a:hover { text-decoration: underline; }
</style>
{% endblock %}

{% block content %}
<div class="auth-page">
    <div class="auth-card">
        <span class="auth-eyebrow">Account</span>
        <h1>Forgot Password?</h1>
        <p class="auth-subtitle">Enter your email and we'll send you a link to reset your password.</p>

        <form method="POST" action="{{ url_for('auth.forgot_password') }}">
            <input type="hidden" name="csrf_token" value="{{ csrf_token() }}">
            <div class="auth-field">
                <label for="email">Email Address</label>
                <input type="email" id="email" name="email" required autocomplete="email"
                       placeholder="you@example.com">
            </div>
            <button type="submit" class="btn btn-primary auth-submit">Send Reset Link</button>
        </form>

        <div class="auth-links">
            <a href="{{ url_for('auth.login') }}">← Back to login</a>
        </div>
    </div>
</div>
{% endblock %}
