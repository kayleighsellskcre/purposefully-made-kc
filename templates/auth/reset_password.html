{% extends "base.html" %}
{% block title %}Reset Password - Purposefully Made KC{% endblock %}

{% block extra_css %}
<style>
.auth-page {
    min-height: 70vh;
    display: flex;
    align-items: center;
    justify-content: center;
    padding: 4rem 1rem;
}
.auth-card {
    background: #fff;
    border-radius: var(--border-radius);
    box-shadow: var(--box-shadow-luxury);
    border: 1px solid var(--border-light);
    padding: 2.5rem 2rem;
    width: 100%;
    max-width: 440px;
}
.auth-eyebrow {
    font-size: 0.75rem;
    font-weight: 700;
    letter-spacing: 0.14em;
    text-transform: uppercase;
    color: var(--accent-color);
    display: block;
    margin-bottom: 0.5rem;
    text-align: center;
}
.auth-card h1 {
    font-family: var(--font-heading);
    font-size: 1.75rem;
    text-align: center;
    margin-bottom: 0.5rem;
    color: var(--primary-color);
}
.auth-subtitle {
    text-align: center;
    color: var(--text-secondary);
    font-size: 0.9rem;
    margin-bottom: 2rem;
    line-height: 1.6;
}
.auth-field {
    margin-bottom: 1.25rem;
}
.auth-field label {
    display: block;
    font-size: 0.85rem;
    font-weight: 600;
    margin-bottom: 0.4rem;
    color: var(--text-primary);
}
.password-field-wrap {
    position: relative;
}
.password-field-wrap input {
    width: 100%;
    padding: 0.75rem 3rem 0.75rem 1rem;
    border: 1px solid var(--border-color);
    border-radius: 8px;
    font-size: 1rem;
    font-family: var(--font-body);
    transition: border-color 0.2s;
    box-sizing: border-box;
}
.password-field-wrap input:focus {
    outline: none;
    border-color: var(--accent-color);
    box-shadow: 0 0 0 3px rgba(184, 124, 111, 0.12);
}
.toggle-pw {
    position: absolute;
    right: 0.75rem;
    top: 50%;
    transform: translateY(-50%);
    background: none;
    border: none;
    cursor: pointer;
    color: var(--text-secondary);
    padding: 0.25rem;
    line-height: 1;
}
.toggle-pw:hover { color: var(--accent-color); }
.pw-hint {
    font-size: 0.78rem;
    color: var(--text-secondary);
    margin-top: 0.3rem;
}
.auth-submit {
    width: 100%;
    padding: 0.9rem;
    font-size: 0.9rem;
    font-weight: 700;
    letter-spacing: 0.06em;
    text-transform: uppercase;
    margin-top: 0.25rem;
}
</style>
{% endblock %}

{% block content %}
<div class="auth-page">
    <div class="auth-card">
        <span class="auth-eyebrow">Account</span>
        <h1>Choose New Password</h1>
        <p class="auth-subtitle">Pick something strong — at least 8 characters.</p>

        <form method="POST" action="{{ url_for('auth.reset_password', token=token) }}">
            <input type="hidden" name="csrf_token" value="{{ csrf_token() }}">

            <div class="auth-field">
                <label for="password">New Password</label>
                <div class="password-field-wrap">
                    <input type="password" id="password" name="password" required
                           autocomplete="new-password" minlength="8">
                    <button type="button" class="toggle-pw" aria-label="Show password"
                            onclick="var i=this.previousElementSibling;var show=i.type==='password';i.type=show?'text':'password';this.innerHTML=show?'<svg width=\'16\' height=\'16\' viewBox=\'0 0 24 24\' fill=\'none\' stroke=\'currentColor\' stroke-width=\'2\'><path d=\'M17.94 17.94A10.07 10.07 0 0 1 12 20c-7 0-11-8-11-8a18.45 18.45 0 0 1 5.06-5.94\'/><path d=\'M9.9 4.24A9.12 9.12 0 0 1 12 4c7 0 11 8 11 8a18.5 18.5 0 0 1-2.16 3.19\'/><line x1=\'1\' y1=\'1\' x2=\'23\' y2=\'23\'/></svg>':'<svg width=\'16\' height=\'16\' viewBox=\'0 0 24 24\' fill=\'none\' stroke=\'currentColor\' stroke-width=\'2\'><path d=\'M1 12s4-8 11-8 11 8 11 8-4 8-11 8-11-8-11-8z\'/><circle cx=\'12\' cy=\'12\' r=\'3\'/></svg>';">
                        <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                            <path d="M1 12s4-8 11-8 11 8 11 8-4 8-11 8-11-8-11-8z"/>
                            <circle cx="12" cy="12" r="3"/>
                        </svg>
                    </button>
                </div>
                <p class="pw-hint">Minimum 8 characters</p>
            </div>

            <div class="auth-field">
                <label for="confirm_password">Confirm Password</label>
                <div class="password-field-wrap">
                    <input type="password" id="confirm_password" name="confirm_password" required
                           autocomplete="new-password" minlength="8">
                </div>
            </div>

            <button type="submit" class="btn btn-primary auth-submit">Set New Password</button>
        </form>
    </div>
</div>
{% endblock %}
