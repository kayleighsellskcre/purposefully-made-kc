{% extends "admin/base_admin.html" %}

{% block title %}Edit {{ collection.name }} - Admin - Purposefully Made KC{% endblock %}

{% block extra_css %}
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bebas+Neue&family=Oswald:wght@500;600;700&family=Anton&family=Teko:wght@400;500;600;700&family=Graduate&family=Squada+One&display=swap" media="print" onload="this.media='all'">
<link rel="stylesheet" href="https://fonts.cdnfonts.com/css/jersey-m54" media="print" onload="this.media='all'">
<link rel="stylesheet" href="{{ url_for('static', filename='css/personalization-fonts.css') }}?v=49">
{% endblock %}

{% block admin_content %}
<section class="adm-notes" id="adminNotes">
    <form method="post" action="{{ url_for('admin.collection_admin_notes', collection_id=collection.id) }}">
        <input type="hidden" name="csrf_token" value="{{ csrf_token() }}">
        <label for="adminNotesField"><strong>Your notes</strong> <span>Only you can see this. Customers and organizers never do. Write how you handle this group so you can do it the same way next time.</span></label>
        <textarea id="adminNotesField" name="admin_notes" rows="4" maxlength="5000" placeholder="Pickup is at the school office. Invoice the PTA in January. Use the 2024 logo.">{{ collection.admin_notes or '' }}</textarea>
        <button class="btn btn-outline btn-sm" type="submit">Save notes</button>
    </form>
</section>
{% include 'includes/group_order_edit_form.html' %}
{% endblock %}
