<script>
window.pmCopy = window.pmCopy || function (btn) {
    var text = btn.getAttribute('data-copy'), label = btn.getAttribute('data-label') || btn.textContent;
    btn.setAttribute('data-label', label);
    function done() { btn.textContent = 'Copied'; setTimeout(function () { btn.textContent = label; }, 1800); }
    var t = document.createElement('textarea'), ok = false;
    t.value = text; t.setAttribute('readonly', '');
    t.style.position = 'fixed'; t.style.top = '0'; t.style.opacity = '0';
    document.body.appendChild(t); t.select(); t.setSelectionRange(0, text.length);
    try { ok = document.execCommand('copy'); } catch (e) { ok = false; }
    document.body.removeChild(t);
    if (ok) { done(); return; }
    if (navigator.clipboard) {
        navigator.clipboard.writeText(text).then(done, function () { window.prompt('Copy this link:', text); });
    } else {
        window.prompt('Copy this link:', text);
    }
};
</script>
