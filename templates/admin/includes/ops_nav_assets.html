{# Shared admin nav styles + tap behavior (included once per admin shell) #}
<style>
/* ── Admin page shell ── */
.ops-page { padding: 2rem 0 4rem; }

/* ── Nav bar ── */
.ops-nav {
    display: flex;
    align-items: center;
    gap: 0.15rem;
    margin-bottom: 2rem;
    padding: 0.5rem 0.75rem;
    background: #fff;
    border: 1px solid rgba(232,208,177,0.55);
    border-radius: 14px;
    box-shadow: 0 2px 12px rgba(58,61,72,0.05);
    position: relative;
    z-index: 200;
}

.ops-nav-top {
    display: contents;
}

.ops-nav-toggle {
    display: none;
    align-items: center;
    justify-content: center;
    gap: 0.4rem;
    margin-left: auto;
    padding: 0.5rem 0.9rem;
    min-height: 44px;
    border: 1.5px solid rgba(232,208,177,0.8);
    border-radius: 10px;
    background: var(--ivory-silk, #faf7f2);
    color: var(--terra-cotta, #b87c6f);
    font-size: 0.82rem;
    font-weight: 700;
    font-family: inherit;
    cursor: pointer;
    touch-action: manipulation;
}

.ops-nav-toggle-icon { transition: transform 0.2s; }
.ops-nav.is-open .ops-nav-toggle-icon { transform: rotate(180deg); }

.ops-nav-menus {
    display: contents;
}

.ops-nav-home {
    display: inline-flex;
    align-items: center;
    gap: 0.3rem;
    padding: 0.45rem 1rem 0.45rem 0.7rem;
    border-radius: 9px;
    text-decoration: none;
    color: var(--terra-cotta, #b87c6f);
    font-size: 0.8rem;
    font-weight: 700;
    letter-spacing: 0.03em;
    white-space: nowrap;
    flex-shrink: 0;
    transition: background 0.15s;
    min-height: 44px;
}
.ops-nav-home:hover { background: rgba(184,124,111,0.08); }

.ops-nav-divider {
    width: 1px;
    height: 22px;
    background: rgba(232,208,177,0.7);
    margin: 0 0.4rem;
    flex-shrink: 0;
}

.ops-dropdown {
    position: relative;
    flex-shrink: 0;
}

.ops-dropdown-btn {
    display: inline-flex;
    align-items: center;
    gap: 0.35rem;
    padding: 0.45rem 0.85rem;
    min-height: 44px;
    border: none;
    border-radius: 9px;
    background: transparent;
    color: var(--text-secondary, #888);
    font-size: 0.8rem;
    font-weight: 500;
    cursor: pointer;
    white-space: nowrap;
    transition: background 0.15s, color 0.15s;
    font-family: inherit;
    touch-action: manipulation;
}
.ops-dropdown-btn:hover,
.ops-dropdown:hover .ops-dropdown-btn {
    background: var(--ivory-silk, #faf7f2);
    color: var(--terra-cotta, #b87c6f);
}
.ops-dropdown-active .ops-dropdown-btn {
    background: rgba(184,124,111,0.1);
    color: var(--terra-cotta, #b87c6f);
    font-weight: 700;
}
.ops-chevron {
    transition: transform 0.2s;
    flex-shrink: 0;
}
.ops-dropdown:hover .ops-chevron,
.ops-dropdown.ops-open .ops-chevron { transform: rotate(180deg); }

.ops-dropdown-menu {
    display: none;
    position: absolute;
    top: calc(100% + 6px);
    left: 0;
    min-width: 210px;
    background: #fff;
    border: 1px solid rgba(232,208,177,0.55);
    border-radius: 14px;
    box-shadow: 0 12px 36px rgba(58,61,72,0.13);
    padding: 0.4rem;
    z-index: 9999;
    animation: opsDropIn 0.18s ease;
}
@keyframes opsDropIn {
    from { opacity: 0; transform: translateY(-6px); }
    to   { opacity: 1; transform: none; }
}

/* Desktop: hover opens menus */
@media (hover: hover) and (pointer: fine) {
    .ops-dropdown:hover .ops-dropdown-menu { display: block; }
}
/* Keyboard / click open (all devices) */
.ops-dropdown.ops-open .ops-dropdown-menu { display: block; }

.ops-drop-item {
    display: flex;
    align-items: center;
    gap: 0.55rem;
    padding: 0.65rem 0.85rem;
    min-height: 44px;
    border-radius: 9px;
    text-decoration: none;
    color: var(--text-secondary, #666);
    font-size: 0.82rem;
    font-weight: 500;
    transition: background 0.13s, color 0.13s;
    white-space: nowrap;
}
.ops-drop-badge {
    margin-left: auto;
    background: var(--terra-cotta, #b87c6f);
    color: #fff;
    font-size: 0.68rem;
    font-weight: 700;
    line-height: 1;
    padding: 0.18rem 0.42rem;
    border-radius: 999px;
    min-width: 1.1rem;
    text-align: center;
}
.ops-drop-item:hover {
    background: var(--ivory-silk, #faf7f2);
    color: var(--terra-cotta, #b87c6f);
}
.ops-drop-active {
    background: rgba(184,124,111,0.1);
    color: var(--terra-cotta, #b87c6f);
    font-weight: 700;
}

/* ── Phone: stacked accordion menu ── */
@media (max-width: 768px) {
    .ops-page { padding: 1rem 0 3rem; }

    .ops-nav {
        flex-direction: column;
        align-items: stretch;
        gap: 0;
        padding: 0.65rem 0.75rem;
        overflow: visible;
    }

    .ops-nav-top {
        display: flex;
        align-items: center;
        justify-content: space-between;
        gap: 0.75rem;
        width: 100%;
    }

    .ops-nav-toggle { display: inline-flex; }

    .ops-nav-menus {
        display: none;
        flex-direction: column;
        width: 100%;
        gap: 0.25rem;
        padding-top: 0.55rem;
        margin-top: 0.55rem;
        border-top: 1px solid rgba(232,208,177,0.55);
    }
    .ops-nav.is-open .ops-nav-menus { display: flex; }

    .ops-nav-divider { display: none; }

    .ops-dropdown { width: 100%; }

    .ops-dropdown-btn {
        width: 100%;
        justify-content: space-between;
        padding: 0.7rem 0.85rem;
        background: var(--ivory-silk, #faf7f2);
    }

    .ops-dropdown-menu {
        position: static;
        display: none;
        min-width: 0;
        width: 100%;
        margin-top: 0.25rem;
        box-shadow: none;
        border: none;
        background: transparent;
        padding: 0 0 0.35rem;
        animation: none;
    }
    /* Kill hover-open on phones - tap only */
    .ops-dropdown:hover .ops-dropdown-menu { display: none !important; }
    .ops-dropdown.ops-open .ops-dropdown-menu { display: flex !important; flex-direction: column; }

    .ops-drop-item {
        white-space: normal;
        padding-left: 1rem;
    }
}

/* Nested admin-page inside ops shell - avoid double gutters & huge top padding */
.ops-page .admin-page {
    padding: 0 0 1rem !important;
}
.ops-page .admin-page > .container {
    max-width: none;
    padding-left: 0;
    padding-right: 0;
    width: 100%;
}

/* Shared admin headers / forms / grids on phones */
@media (max-width: 768px) {
    .ops-page .admin-header,
    .admin-page .admin-header {
        flex-direction: column !important;
        align-items: stretch !important;
        gap: 0.85rem;
        margin-bottom: 1.25rem !important;
    }
    .ops-page .admin-header .btn,
    .admin-page .admin-header .btn {
        width: 100%;
        justify-content: center;
        min-height: 48px;
    }

    .form-section {
        padding: 1.15rem !important;
        margin-bottom: 1.15rem !important;
    }

    .collections-grid {
        grid-template-columns: 1fr !important;
        gap: 1rem !important;
    }
    .collection-card { padding: 1.15rem !important; }
    .collection-header {
        flex-direction: column;
        align-items: flex-start !important;
        gap: 0.5rem;
    }
    .collection-link {
        flex-direction: column;
        align-items: stretch;
    }
    .collection-link .link-input,
    .collection-link .btn { width: 100%; }

    .adm-table th,
    .adm-table td {
        padding: 0.75rem 0.85rem;
    }

    .ops-grid {
        grid-template-columns: 1fr !important;
    }
    .ops-form-inline {
        flex-direction: column;
        align-items: stretch;
    }
    .ops-form-inline input,
    .ops-form-inline select,
    .ops-form-inline .btn {
        width: 100%;
    }

    .product-checkboxes {
        grid-template-columns: 1fr 1fr !important;
        gap: 0.65rem !important;
    }
}

@media (max-width: 480px) {
    .ops-page h1,
    .ops-page .adm-page-title,
    .ops-page .prod-title,
    .ops-page .ord-title,
    .ops-page .aff-title,
    .ops-page .gallery-page-title,
    .ops-page .wf-title { font-size: 1.65rem; }

    .product-checkboxes {
        grid-template-columns: 1fr !important;
    }
}

/* Shared page typography inside ops shell */
.ops-page h1,
.ops-page .adm-page-title,
.ops-page .prod-title,
.ops-page .ord-title,
.ops-page .aff-title,
.ops-page .gallery-page-title,
.ops-page .wf-title {
    font-family: var(--font-heading);
    font-size: 2rem;
    font-weight: 700;
    color: var(--text-primary);
    margin: 0.25rem 0 0.4rem;
    line-height: 1.15;
}

.ops-page h2,
.ops-page .adm-section-title,
.ops-page .gallery-upload-title,
.ops-page .gallery-list-title {
    font-family: var(--font-heading);
    font-size: 1.15rem;
    font-weight: 600;
    color: var(--text-primary);
    margin: 0 0 0.25rem;
    line-height: 1.3;
}

.ops-page .page-subtitle,
.ops-page .adm-page-lead,
.ops-page .prod-lead,
.ops-page .ord-lead,
.ops-page .aff-lead,
.ops-page .gallery-page-subtitle,
.ops-page .wf-lead {
    color: var(--text-secondary);
    font-size: 0.88rem;
    line-height: 1.55;
    margin: 0;
}
</style>

<script>
(function () {
    var nav = document.getElementById('opsNav');
    if (!nav) return;

    var toggle = document.getElementById('opsNavToggle');

    function closeAllDropdowns(except) {
        nav.querySelectorAll('.ops-dropdown.ops-open').forEach(function (d) {
            if (d === except) return;
            d.classList.remove('ops-open');
            var btn = d.querySelector('.ops-dropdown-btn');
            if (btn) btn.setAttribute('aria-expanded', 'false');
        });
    }

    if (toggle) {
        toggle.addEventListener('click', function (e) {
            e.stopPropagation();
            var open = nav.classList.toggle('is-open');
            toggle.setAttribute('aria-expanded', open ? 'true' : 'false');
            if (!open) {
                closeAllDropdowns();
                return;
            }
            /* Auto-expand the section for the current page */
            if (window.matchMedia('(max-width: 768px)').matches) {
                var active = nav.querySelector('.ops-dropdown-active');
                if (active) {
                    closeAllDropdowns(active);
                    active.classList.add('ops-open');
                    var activeBtn = active.querySelector('.ops-dropdown-btn');
                    if (activeBtn) activeBtn.setAttribute('aria-expanded', 'true');
                }
            }
        });
    }

    nav.querySelectorAll('.ops-dropdown-btn').forEach(function (btn) {
        btn.addEventListener('click', function (e) {
            e.preventDefault();
            e.stopPropagation();
            var drop = btn.closest('.ops-dropdown');
            var willOpen = !drop.classList.contains('ops-open');
            closeAllDropdowns(drop);
            drop.classList.toggle('ops-open', willOpen);
            btn.setAttribute('aria-expanded', willOpen ? 'true' : 'false');
            if (willOpen && window.matchMedia('(max-width: 768px)').matches) {
                nav.classList.add('is-open');
                if (toggle) toggle.setAttribute('aria-expanded', 'true');
            }
        });
    });

    document.addEventListener('click', function (e) {
        if (e.target.closest('.ops-nav')) return;
        closeAllDropdowns();
        if (window.matchMedia('(max-width: 768px)').matches) {
            nav.classList.remove('is-open');
            if (toggle) toggle.setAttribute('aria-expanded', 'false');
        }
    });
})();
</script>

<style>
/* ── Compact admin (desktop) ──
   Tighter spacing, a smaller header, and wider content so more shows at once.
   Text sizes stay readable; phones keep their own layout. */
@media (min-width: 900px) {
    .ops-page { padding: 2rem 0 2.5rem; }   /* leaves room for the logo that hangs below the header */
    .ops-page > .container { max-width: 1480px; padding: 0 1.25rem; }
    .ops-nav { margin-bottom: 0.55rem; padding: 0.3rem 0.6rem; border-radius: 12px; }
    .ops-flow { margin: 0 0 0.75rem; padding: 0.35rem 0.7rem; border-radius: 12px; }
    .ops-flow-step { padding: 0.22rem 0.55rem; }
    .ops-page .adm-table th { padding: 0.55rem 0.8rem; }
    .ops-page .adm-table td { padding: 0.6rem 0.8rem; font-size: 0.88rem; }
    .ops-page .adm-table-wrap { border-radius: 12px; }
    .ops-page .adm-section { margin-bottom: 1.5rem; }
    .ops-page .adm-eyebrow { margin-bottom: 0.15rem; }
}
</style>
<style>
/* admin titles + buttons: one look on every admin page */
@media (min-width: 900px) {
    .ops-page .btn { padding: 0.45rem 1rem; font-size: 0.76rem; letter-spacing: 0.08em; border-radius: 10px; }
    .ops-page .btn-lg { padding: 0.6rem 1.25rem; font-size: 0.82rem; }
    .ops-page h1 { font-size: 1.65rem; margin: 0.05rem 0 0.2rem; text-align: left; }
    .ops-page h2 { font-size: 1.3rem; }
    .ops-page h3 { font-size: 1.1rem; }
    /* eyebrow, title and buttons: title stacks under the eyebrow on the left, buttons sit on the right */
    .ops-page .admin-header:has(> .adm-eyebrow) { display: grid; grid-template-columns: 1fr auto; column-gap: 1rem; align-items: center; margin-bottom: 0.7rem; text-align: left; }
    .ops-page .admin-header:has(> .adm-eyebrow) > .adm-eyebrow { grid-column: 1; grid-row: 1; }
    .ops-page .admin-header:has(> .adm-eyebrow) > h1 { grid-column: 1; grid-row: 2; margin: 0; }
    .ops-page .admin-header:has(> .adm-eyebrow) > :last-child:not(h1):not(.adm-eyebrow) { grid-column: 2; grid-row: 1 / span 2; align-self: center; }
    .ops-page .admin-header:has(> .adm-eyebrow) > h1:last-child { grid-column: 1 / -1; }
    /* the other kind of header: a title block, and a block of buttons beside it */
    .ops-page .admin-header:not(:has(> .adm-eyebrow)) { display: flex; flex-wrap: wrap; justify-content: space-between; align-items: flex-start; gap: 0.6rem 1.25rem; margin-bottom: 0.8rem; }
    .ops-page .admin-header:not(:has(> .adm-eyebrow)) > div:first-child { flex: 1 1 380px; min-width: 0; }
    .ops-page .admin-header:not(:has(> .adm-eyebrow)) > div:first-child h1 { margin: 0.05rem 0 0.2rem; }
    .ops-page .admin-header:not(:has(> .adm-eyebrow)) > div:first-child p { margin: 0; }
    .ops-page .master-actions { display: flex; gap: 0.4rem; flex-wrap: wrap; justify-content: flex-end; align-items: center; }
    .ops-page .admin-header > h1 { text-align: left; }
    .ops-page .admin-header:has(> .adm-eyebrow) > p { grid-column: 1 / -1; grid-row: 3; margin: 0.15rem 0 0; max-width: none; }
    /* The site-wide "break long words anywhere" rule squeezed table columns until words split ("Blac k").
       Keep words whole and only wrap when a single word is wider than its cell. */
    .ops-page td, .ops-page th { word-break: normal; overflow-wrap: break-word; }
}
</style>
