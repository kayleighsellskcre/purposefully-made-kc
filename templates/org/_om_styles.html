<style>
.om { max-width: 860px; margin: 0 auto; padding: 0 1.25rem 5rem; }
.om-head { text-align: center; padding: 2.5rem 1rem 2rem; }
.om-head h1 { font-size: clamp(2rem, 5vw, 2.8rem); margin: 0 0 1rem; }
.om-head-actions { display: flex; flex-wrap: wrap; gap: .6rem; justify-content: center; }
.om-chip { display: inline-flex; align-items: center; gap: .4rem; padding: .5rem 1.2rem; border: 1.5px solid var(--border-color); border-radius: 999px; background: #fff; color: var(--text-primary); font-size: .85rem; font-weight: 600; text-decoration: none; cursor: pointer; transition: var(--transition); }
.om-chip:hover { border-color: var(--accent-color); color: var(--accent-color); }
.om-chip--primary { background: var(--accent-color); border-color: var(--accent-color); color: #fff; }
.om-chip--primary:hover { background: #a56a5d; color: #fff; }
.om-chip--danger:hover { border-color: #c0392b; color: #c0392b; }

.om-card { background: #fff; border: 1px solid var(--border-light); border-radius: 18px; box-shadow: var(--box-shadow); padding: 1.75rem 1.75rem 1.9rem; margin-bottom: 1.75rem; }
.om-card h2 { font-size: 1.5rem; margin: 0 0 .25rem; }
.om-sub { margin: 0 0 1.4rem; color: var(--text-secondary); font-size: .95rem; }
.om-flash { padding: .8rem 1.1rem; border-radius: 12px; margin-bottom: 1.25rem; font-size: .95rem; }
.om-flash.success { background: var(--notice-success-bg, #eef1e9); color: var(--notice-success-fg, #4f5d3a); }
.om-flash.error { background: var(--notice-error-bg, #fbeeec); color: var(--notice-error-fg, #9a4436); }

/* teams */
.om-teams { list-style: none; margin: 0; padding: 0; display: flex; flex-direction: column; gap: .7rem; }
.om-team { display: flex; align-items: center; gap: .9rem; padding: .85rem 1rem; border: 1px solid var(--border-light); border-radius: 14px; background: #fffdf9; transition: var(--transition); }
.om-team.dragging { opacity: .5; }
.om-grip { cursor: grab; color: var(--text-secondary); font-size: 1.2rem; user-select: none; }
.om-team-icon { width: 46px; height: 46px; border-radius: 50%; display: flex; align-items: center; justify-content: center; font-size: 1.5rem; background: radial-gradient(circle at 30% 25%, #fff, var(--ivory-silk) 60%, var(--cashmere-sand)); box-shadow: inset 0 0 0 1px var(--border-light); flex-shrink: 0; }
.om-team-name { flex: 1; min-width: 0; font-family: var(--font-heading); font-size: 1.2rem; font-weight: 600; }
.om-team-name small { display: block; font-family: var(--font-primary); font-size: .8rem; font-weight: 400; color: var(--text-secondary); }
.om-team-actions { display: flex; align-items: center; gap: .5rem; flex-wrap: wrap; justify-content: flex-end; }
.om-more { position: relative; }
.om-more > summary { list-style: none; }
.om-more > summary::-webkit-details-marker { display: none; }
.om-more-menu { position: absolute; right: 0; top: calc(100% + .4rem); z-index: 20; min-width: 220px; background: #fff; border: 1px solid var(--border-light); border-radius: 12px; box-shadow: var(--box-shadow-luxury); padding: .4rem; display: flex; flex-direction: column; }
.om-more-menu a, .om-more-menu button { text-align: left; padding: .55rem .8rem; border: none; background: none; border-radius: 8px; font: inherit; font-size: .9rem; color: var(--text-primary); text-decoration: none; cursor: pointer; }
.om-more-menu a:hover, .om-more-menu button:hover { background: var(--ivory-silk); }
.om-more-menu .om-rename { display: flex; gap: .4rem; padding: .4rem .5rem; }
.om-more-menu .om-rename input { min-width: 0; padding: .4rem .6rem; border: 1px solid var(--border-color); border-radius: 8px; font-size: .9rem; }
.om-more-menu .om-rename input[name="icon"] { width: 3.2rem; text-align: center; }
.om-more-menu .danger { color: #c0392b; }

.om-add { margin-top: 1.1rem; border: 1.5px dashed var(--border-color); border-radius: 14px; padding: .25rem 1rem; }
.om-add > summary { cursor: pointer; list-style: none; padding: .8rem 0; font-weight: 700; color: var(--accent-color); }
.om-add > summary::-webkit-details-marker { display: none; }
.om-add-body { padding: .25rem 0 1rem; display: grid; gap: .9rem; }
.om-add-row { display: grid; grid-template-columns: 5rem 1fr; gap: .75rem; }

/* form fields */
.om-field { margin-bottom: 1.25rem; }
.om-field > label, .om-label { display: block; font-weight: 700; font-size: .92rem; margin-bottom: .4rem; }
.om-field input[type="text"], .om-field input[type="password"], .om-field textarea, .om-field select, .om-add-body input[type="text"], .om-add-body select { width: 100%; padding: .7rem .9rem; border: 1.5px solid var(--border-color); border-radius: 10px; font: inherit; background: #fff; }
.om-field textarea { min-height: 120px; resize: vertical; line-height: 1.6; }
.om-hint { display: block; margin-top: .35rem; color: var(--text-secondary); font-size: .85rem; }

/* images */
.om-imgs { display: grid; grid-template-columns: 1fr 1fr; gap: 1.25rem; }
.om-img { border: 1px solid var(--border-light); border-radius: 14px; padding: 1rem; background: #fffdf9; display: flex; flex-direction: column; gap: .75rem; }
.om-img-view { height: 150px; border-radius: 10px; display: flex; align-items: center; justify-content: center; background: linear-gradient(145deg, var(--ivory-silk), var(--cashmere-sand)); overflow: hidden; position: relative; }
.om-img-view img { max-width: 90%; max-height: 90%; object-fit: contain; }
.om-img-view .om-empty { color: var(--text-secondary); font-size: .9rem; }
.om-img-view--fan { background: linear-gradient(125deg, var(--midnight-charcoal), #4a4350 45%, #8d5e55); }
.om-fan-circles { display: flex; align-items: center; justify-content: center; }
.om-fan-circles span { width: 78px; height: 78px; border-radius: 50%; background: #fff; padding: 8px; border: 3px solid rgba(232,208,177,.8); display: flex; align-items: center; justify-content: center; box-shadow: 0 8px 18px rgba(0,0,0,.3); }
.om-fan-circles span + span { margin-left: -22px; }
.om-fan-circles img { max-width: 100%; max-height: 100%; object-fit: contain; }
.om-img-title { font-weight: 700; font-size: .95rem; }
.om-img-actions { display: flex; flex-wrap: wrap; align-items: center; gap: .5rem .9rem; font-size: .88rem; }
.om-img input[type="file"] { font-size: .85rem; max-width: 100%; }
.om-remove { display: inline-flex; align-items: center; gap: .35rem; color: #c0392b; cursor: pointer; }

.om-photo-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(120px, 1fr)); gap: .8rem; }
.om-photo-grid--small { grid-template-columns: repeat(auto-fill, minmax(90px, 1fr)); }
.om-photo { position: relative; display: flex; flex-direction: column; gap: .35rem; padding: .6rem; border: 1px solid var(--border-light); border-radius: 12px; background: #fff; cursor: pointer; }
.om-photo img { width: 100%; aspect-ratio: 1; object-fit: contain; border-radius: 8px; background: linear-gradient(145deg, var(--ivory-silk), var(--cashmere-sand)); }
.om-photo-tag { font-size: .7rem; letter-spacing: .06em; text-transform: uppercase; color: var(--text-secondary); text-align: center; }
.om-photo-remove { display: flex; align-items: center; justify-content: center; gap: .35rem; font-size: .82rem; color: #c0392b; }
.om-photo-show { display: flex; align-items: center; justify-content: center; gap: .35rem; font-size: .82rem; color: var(--text-primary); cursor: pointer; }
.om-photo-remove { cursor: pointer; }
.om-photo:has(.om-remove-box:checked) { border-color: #c0392b; background: #fdf1ef; }
.om-photo:has(.om-remove-box:checked) img { opacity: .35; }
.om-photo--faded img { opacity: .55; }
.om-photo--faded .om-photo-remove { color: var(--accent-color); }
.om-removed { margin-top: .5rem; }
.om-removed > summary { cursor: pointer; font-size: .88rem; color: var(--text-secondary); margin-bottom: .6rem; }
.om-advanced { margin: .5rem 0 1.5rem; border-top: 1px solid var(--border-light); padding-top: 1rem; }
.om-advanced > summary { cursor: pointer; font-weight: 600; color: var(--text-secondary); }
.om-savebar { display: flex; justify-content: flex-end; }
.om-empty-teams { text-align: center; color: var(--text-secondary); padding: 1rem 0; }

@media (max-width: 640px) {
    .om-card { padding: 1.25rem 1.1rem 1.4rem; }
    .om-imgs { grid-template-columns: 1fr; }
    .om-team { flex-wrap: wrap; }
    .om-team-actions { width: 100%; justify-content: flex-start; padding-left: 2.2rem; }
    .om-add-row { grid-template-columns: 4rem 1fr; }
}
.om-fan { display: flex; align-items: center; gap: 1.5rem; flex-wrap: wrap; }
.om-fan-thumbs { display: flex; align-items: center; padding-left: 14px; }
.om-fan-thumbs span { width: 64px; height: 64px; margin-left: -14px; padding: 7px; border-radius: 50%; background: #fff; border: 3px solid var(--cashmere-sand); box-shadow: 0 6px 14px rgba(58,61,72,.18); display: flex; align-items: center; justify-content: center; }
.om-fan-thumbs img { max-width: 100%; max-height: 100%; object-fit: contain; }
.om-fan-thumbs .om-fan-none { width: auto; height: auto; padding: .5rem 1rem; border-radius: 12px; border: 1px dashed var(--border-color); box-shadow: none; font-size: .88rem; color: var(--text-secondary); }
.om-fan-facts { list-style: none; margin: 0; padding: 0; flex: 1; min-width: 180px; display: flex; flex-direction: column; gap: .25rem; color: var(--text-secondary); font-size: .95rem; }
.om-fan-facts b { color: var(--text-primary); }
</style>
